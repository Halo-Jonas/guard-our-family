<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 核心口诀 停看查问不转 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide dark-slide">
    <div class="slide-inner">
      <span class="kicker" style="background:var(--warm);color:#3a2600">最该记住的一句</span>
      <div class="two-col img-left">
        <div class="col-text" style="gap:.4rem">
          <h1 style="color:#fff;font-size:5rem;letter-spacing:.1em">停 · 看 · 查<br>问 · 不转</h1>
        </div>
        <div class="figure"><img src="../images/mantra_guide.png" alt="查查爷爷竖大拇指"></div>
      </div>
      <div class="cards" style="grid-template-columns:repeat(5,1fr);margin-top:1rem">
        <div class="card" style="flex-direction:column;text-align:center;gap:.3em"><b style="color:var(--warm-deep);font-size:2rem">停</b><span style="font-size:1.25rem">越催越不急</span></div>
        <div class="card" style="flex-direction:column;text-align:center;gap:.3em"><b style="color:var(--warm-deep);font-size:2rem">看</b><span style="font-size:1.25rem">来源日期地点</span></div>
        <div class="card" style="flex-direction:column;text-align:center;gap:.3em"><b style="color:var(--warm-deep);font-size:2rem">查</b><span style="font-size:1.25rem">医生官方原文</span></div>
        <div class="card" style="flex-direction:column;text-align:center;gap:.3em"><b style="color:var(--warm-deep);font-size:2rem">问</b><span style="font-size:1.25rem">问AI要来源</span></div>
        <div class="card" style="flex-direction:column;text-align:center;gap:.3em"><b style="color:var(--red);font-size:2rem">不转</b><span style="font-size:1.25rem">查不清就打住</span></div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
