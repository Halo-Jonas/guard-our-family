<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 套路⑤旧闻翻新 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">套路 ⑤</span>
      <h2>查查日期，防止「旧闻穿新衣」</h2>
      <div class="two-col img-left">
        <div class="figure"><img src="../images/trick5_oldnews.png" alt="旧报纸包成新礼物"></div>
        <div class="col-text" style="gap:.8rem">
          <p>很多群消息不是全编的，而是「旧消息重新发」：几年前的事说成最近、每年换个年份继续传。看到「刚刚」「今天」「紧急」，重点看：<b>原始日期 · 年份 · 城市 · 文件编号 · 官网还在不在</b>。</p>
          <div class="example">
            <span class="tag">群里常见这样</span>
            <div class="msg">「紧急通知：本市今晚12点开始大范围停水3天，请尽快储水！」</div>
            <div class="flaw">🔎 破绽：同一条每年都发一遍，只换城市名；官网根本查不到。</div>
          </div>
          <div class="punch" style="font-size:2rem">微信群里今天收到，不代表事情今天发生。</div>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
