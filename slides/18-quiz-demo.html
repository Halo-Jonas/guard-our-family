<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>18 找茬示范题 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">一起来找茬 · 先看示范</span>
      <h2>这条消息，哪里有问题？</h2>
      <div class="two-col img-left">
        <div class="figure"><img src="../images/exercise.png" alt="放大镜找茬"></div>
        <div class="col-text">
          <div class="punch" style="background:#fff;color:var(--ink);border-color:var(--blue-line);font-size:1.7rem;font-weight:600;line-height:1.6">
            「某医院主任紧急提醒：今晚十二点以后千万不能喝水，赶快转给家人，好人一生平安！」
          </div>
          <div class="cards" style="grid-template-columns:1fr 1fr;margin-top:.4rem">
            <div class="card" style="font-size:1.4rem"><span class="ic">❌</span><div>医生<b>没名字</b></div></div>
            <div class="card" style="font-size:1.4rem"><span class="ic">❌</span><div>医院<b>不明确</b></div></div>
            <div class="card" style="font-size:1.4rem"><span class="ic">❌</span><div><b>没有</b>原始出处</div></div>
            <div class="card" style="font-size:1.4rem"><span class="ic">❌</span><div>又<b>吓人</b>又<b>催转</b></div></div>
          </div>
          <p style="font-size:1.4rem;color:var(--warm-deep);font-weight:700;margin-top:.3rem">👇 下面几道，换您来当侦探！</p>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
