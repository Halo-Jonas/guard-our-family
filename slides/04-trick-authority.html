<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 套路①假借权威 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">套路 ①</span>
      <h2>假借权威，却说不清「谁说的」</h2>
      <div class="two-col img-left">
        <div class="figure"><img src="../images/trick1_authority.png" alt="说不清是谁的假医生"></div>
        <div class="col-text" style="gap:.85rem">
          <p>「某三甲医院老院长说」「卫生部门内部消息」……有专家，不等于有依据。查证只问三句话：</p>
          <div class="card" style="display:block;line-height:1.9">
            <b style="color:var(--blue)">1️⃣ 医生全名？</b>
            <b style="color:var(--blue)">2️⃣ 哪家医院、哪个科室？</b>
            <b style="color:var(--blue)">3️⃣ 官网有原文吗？</b>
          </div>
          <div class="example">
            <span class="tag">群里常见这样</span>
            <div class="msg">「北京某三甲医院退休老院长冒死揭露：早上空腹吃一物，血管垃圾全清光！」</div>
            <div class="flaw">🔎 破绽：哪位院长？叫什么？哪家医院？——全都没有。</div>
          </div>
          <div class="punch blue" style="font-size:2rem">先查专家在不在，再查他真说过没。</div>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
