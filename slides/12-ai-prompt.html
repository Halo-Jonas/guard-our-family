<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 可复制的AI核实提问 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide accent-slide">
    <div class="slide-inner">
      <span class="kicker">照着抄就行</span>
      <h2>发给 AI 的「核实提问」</h2>
      <p class="lead" style="margin-bottom:.8rem">遇到可疑消息，把<b>原消息</b>和下面这段话，一起发给 AI 👇</p>
      <div class="ask-box">
        <p class="q">请帮我核实下面这条消息，不要只回答「真」或「假」。请检查：</p>
        <p>① 消息里的医生 / 医院 / 机构是否<b>真实存在</b>；<br>
        ② 他们是否<b>真的说过</b>这些话；<br>
        ③ 能否找到医院官网、政府或正规媒体的<b>原始出处</b>；<br>
        ④ 图片的<b>时间、地点</b>是否与文字一致；<br>
        ⑤ 是否已有权威机构<b>辟谣</b>；<br>
        ⑥ 请给我<b>能亲自打开核对</b>的来源。<br>
        <b>如果没有可靠证据，请直接说「暂时无法确认」，不要猜。</b></p>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
