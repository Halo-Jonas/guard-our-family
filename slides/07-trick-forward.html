<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 套路④道德绑架转发 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">套路 ④</span>
      <h2>要求转发，还来「道德绑架」</h2>
      <div class="two-col">
        <div class="col-text">
          <p>「不转不是中国人」「转发积德」「看完不转会倒霉」「好人一生平安」「请保留两小时，别断在你这里」……</p>
          <div class="punch blue" style="font-size:2rem">事实不靠转发次数变真，善良也不靠群发证明。</div>
          <p style="margin-top:.6rem">真正的好消息，不会<b>威胁</b>你转发；真正的善良，也包括<b>不把没核实的消息传给别人</b>。</p>
          <div class="example">
            <span class="tag">群里常见这样</span>
            <div class="msg">「转发这条锦鲤，今天不转全家不平安；转到3个群，好运马上来！」</div>
            <div class="flaw">🔎 破绽：用「倒霉／积德」逼你转——真事实，从不需要威胁。</div>
          </div>
        </div>
        <div class="figure"><img src="../images/trick4_forward.png" alt="转发绑架"></div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
