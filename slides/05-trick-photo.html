<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 套路②一图编故事 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">套路 ②</span>
      <h2>一张图片，不等于一个事实</h2>
      <div class="two-col">
        <div class="col-text">
          <p>同一张图，能被编成一百个故事：旧图说成刚发生、外地说成本地、截图改了标题、干脆 AI 直接画一张。</p>
          <div class="punch" style="font-size:2rem">图片只能证明「有这张图」，不能证明「配的字是真的」。</div>
          <p style="margin-top:.6rem">看到图，查四样：<b>最早何时出现 · 原本发生在哪 · 有无完整报道 · 官方发了没</b>。</p>
          <div class="example">
            <span class="tag">群里常见这样</span>
            <div class="msg">一张菜市场照片配字：「本地今早刚拍到，这种鱼千万别买，吃了会中毒！」</div>
            <div class="flaw">🔎 破绽：一搜才发现，是三年前外地的旧图，被换了地名反复发。</div>
          </div>
        </div>
        <div class="figure"><img src="../images/trick2_photo.png" alt="同一张图被编成不同身份"></div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
