<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 套路③危言耸听 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">套路 ③</span>
      <h2>特别吓人、特别着急、特别绝对</h2>
      <div class="two-col img-left">
        <div class="figure"><img src="../images/trick3_scare.png" alt="满屏惊恐，爷爷淡定"></div>
        <div class="col-text" style="gap:.9rem">
          <div class="card" style="display:block;line-height:2.1">
            <span style="white-space:nowrap"><b style="color:var(--red)">😱 吓人</b>「每天在吃毒药」</span>
            <span style="white-space:nowrap"><b style="color:var(--warm-deep)">⏰ 催促</b>「今晚就删」</span>
            <span style="white-space:nowrap"><b style="color:var(--blue)">💯 绝对</b>「包治百病」</span>
            <span style="white-space:nowrap"><b style="color:var(--green)">🤫 阴谋</b>「医院不会告诉你」</span>
          </div>
          <div class="example">
            <span class="tag">群里常见这样</span>
            <div class="msg">「紧急！这种水果打了针，全家吃了会致癌，医院都不敢说，赶紧扩散！」</div>
            <div class="flaw">🔎 一句话「吓人＋阴谋＋催促」全占了——越全占，越是假。</div>
          </div>
          <div class="punch" style="font-size:2rem">越让你害怕、愤怒、激动，越要先冷静。</div>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
