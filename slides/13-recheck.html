<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13 问完AI再检查三次 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">别急着信</span>
      <h2>问完 AI，再做三次检查</h2>
      <div class="two-col img-left">
        <div class="figure"><img src="../images/ask_ai.png" alt="AI也会不确定"></div>
        <div class="col-text">
          <div class="cards">
            <div class="card"><span class="ic">🔍</span><div>AI 有没有<b>给出来源</b>？</div></div>
            <div class="card"><span class="ic">🏛️</span><div>来源是不是<b>医院、政府、正规媒体</b>？</div></div>
            <div class="card"><span class="ic">👆</span><div>点开来源，里面<b>真的有这句话</b>吗？</div></div>
          </div>
          <div class="punch">两个 AI 都说真，也不一定真。<br>关键还是看<b>原始证据</b>。</div>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
