<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>21 练习③扫码领补贴 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide accent-slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">练习 ③　换您当侦探</span>
      <div class="quiz">
        <div class="quiz-q">
          <div class="quiz-msg">「国家发钱啦！<b>社保补贴</b>正在清退，扫描下方二维码登记身份证和银行卡，逾期作废！」</div>
          <div class="think">🤔 先想想：能扫码登记吗？</div>
          <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">👆 点我看破绽</button>
          <div class="answer">
            <div class="atitle">🔎 破绽在这里：</div>
            <div class="aitem"><span class="x">✗</span><div>真补贴走<b>社保局官方</b>，不靠群里扫码</div></div>
            <div class="aitem"><span class="x">✗</span><div>「逾期作废」是<b>催你慌</b>，好让你来不及想</div></div>
            <div class="aitem"><span class="x">✗</span><div>要身份证+银行卡的二维码，<b>一律别扫</b></div></div>
          </div>
        </div>
        <div class="figure"><img src="../images/quiz_qrcode.png" alt="扫码领补贴诈骗"></div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
