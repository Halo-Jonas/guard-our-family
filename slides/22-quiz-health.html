<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>22 练习④神药停西药 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide accent-slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">练习 ④　换您当侦探</span>
      <div class="quiz">
        <div class="figure"><img src="../images/quiz_health.png" alt="神药诈骗"></div>
        <div class="quiz-q">
          <div class="quiz-msg">「祖传<b>神药</b>，三个疗程根治高血压、糖尿病，无需再吃西药！前 100 名免费送，加微信抢购！」</div>
          <div class="think">🤔 先想想：能停西药试试吗？</div>
          <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">👆 点我看破绽</button>
          <div class="answer">
            <div class="atitle">🔎 破绽在这里：</div>
            <div class="aitem"><span class="x">✗</span><div>「根治」慢性病、「无需西药」——<b>最危险的谎</b></div></div>
            <div class="aitem"><span class="x">✗</span><div>擅自停药可能<b>出大事</b>，务必听医生的</div></div>
            <div class="aitem"><span class="x">✗</span><div>「免费送+加微信抢」是<b>卖货套路</b></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
