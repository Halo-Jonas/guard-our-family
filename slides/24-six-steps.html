<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 分享流程六步走 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">现场查一条</span>
      <h2>六步走，带大家实操一遍</h2>
      <div class="steps">
        <div class="step"><span class="num">1</span>先找<b>发布者</b>是谁</div>
        <div class="step"><span class="num">2</span>再查<b>日期和地点</b></div>
        <div class="step"><span class="num">3</span>搜<b>医生和医院</b></div>
        <div class="step"><span class="num">4</span>问 <b>AI</b>，并要求提供<b>来源</b></div>
        <div class="step"><span class="num">5</span>查看<b>官方辟谣</b>渠道</div>
        <div class="step"><span class="num">6</span>决定<b>转不转</b></div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
