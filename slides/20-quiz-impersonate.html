<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 练习②冒充子女 · 假消息判断指南</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <section class="slide accent-slide">
    <img class="mini-mascot" src="../images/mascot.png" alt="查查爷爷">
    <div class="slide-inner">
      <span class="kicker">练习 ②　换您当侦探</span>
      <div class="quiz">
        <div class="figure"><img src="../images/quiz_impersonate.png" alt="冒充子女要钱"></div>
        <div class="quiz-q">
          <div class="quiz-msg">「妈，我手机摔坏了换了新号。我现在急用钱交学费，你先转 <b>5000</b> 到这个账户，别打电话我在上课。」</div>
          <div class="think">🤔 先想想：该不该转？</div>
          <button class="reveal-btn" onclick="this.nextElementSibling.classList.toggle('show')">👆 点我看破绽</button>
          <div class="answer">
            <div class="atitle">🔎 破绽在这里：</div>
            <div class="aitem"><span class="x">✗</span><div>「换了新号」+「别打电话」——<b>就怕你核实</b></div></div>
            <div class="aitem"><span class="x">✗</span><div>一定要<b>当面或视频</b>确认是不是本人</div></div>
            <div class="aitem"><span class="x">✗</span><div>凡是「先转钱、别声张」，先<b>挂断打老号码</b></div></div>
          </div>
        </div>
      </div>
    </div>
  </section>
<script src="../assets/slide.js"></script>
</body>
</html>
